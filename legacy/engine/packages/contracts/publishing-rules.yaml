# Platform postability rules (docs/POSTABILITY.md).
# Data, not code: the validator loads this at startup and applies the
# STRICTEST UNION of rules across a campaign's publish_targets, plus
# brief-derived rules (duration cap, expected aspect, audio-required).
#
# !! Every rule block carries `verified:`. Seeded values are last-known as of
# 2026-09 and MUST be re-verified against each platform's current API docs
# before that platform's publishing (or manual-posting reliance) goes live.
# API limits differ from app limits — these are the API/posting limits.
# Once publishing is live, CI fails if any verified date is older than 90 days.

rules_version: "2026.09"

video:
  tiktok:
    verified: 2026-09-04   # seed — re-verify against TikTok Content Posting API docs
    containers: [mp4, mov, webm]
    video_codecs: [h264, hevc]
    audio_codecs: [aac]
    duration_s: { min: 3, max: 600 }
    size_bytes: { max: 4294967296 }        # 4 GB
    fps: { min: 23, max: 60 }
    resolution: { min_width: 540, min_height: 960, max_width: 1080, max_height: 1920 }
    aspect: { recommended: "9:16" }
  instagram:                                # Reels via Graph API
    verified: 2026-09-04   # seed — re-verify against IG Content Publishing docs
    containers: [mp4, mov]
    video_codecs: [h264]
    audio_codecs: [aac]
    duration_s: { min: 3, max: 900 }
    size_bytes: { max: 1073741824 }        # 1 GB
    fps: { min: 23, max: 60 }
    resolution: { min_width: 540 }
    aspect: { recommended: "9:16" }
    audio_sample_rate_hz: { max: 48000 }
  facebook:
    verified: 2026-09-04   # seed — re-verify against FB video API docs
    containers: [mp4, mov]
    video_codecs: [h264]
    audio_codecs: [aac]
    duration_s: { max: 14400 }
    size_bytes: { max: 4294967296 }
    aspect: { recommended: "9:16" }
  x:
    verified: 2026-09-04   # seed — re-verify against X API v2 media docs
    containers: [mp4]
    video_codecs: [h264]
    audio_codecs: [aac]
    duration_s: { min: 0.5, max: 140 }
    size_bytes: { max: 536870912 }         # 512 MB
    fps: { max: 60 }
    resolution: { max_width: 1920, max_height: 1920 }  # 1080x1920 vertical accepted
                                            # (1920x1200 is X's landscape figure)
    aspect: { min: "1:3", max: "3:1" }
    bitrate_kbps: { max: 25000 }

image:
  tiktok:                                   # photo-mode posts
    verified: 2026-09-04
    formats: [jpeg, png, webp]
    size_bytes: { max: 20971520 }          # 20 MB
  instagram:
    verified: 2026-09-04
    formats: [jpeg]                         # Graph API accepts JPEG only;
                                            # non-JPEG is a BLOCKER (a silent
                                            # server-side convert would break
                                            # score-what-you-post)
    size_bytes: { max: 8388608 }           # 8 MB
    aspect: { min: "4:5", max: "1.91:1" }
    resolution: { min_width: 320, max_width: 1440 }
  facebook:
    verified: 2026-09-04
    formats: [jpeg, png]
    size_bytes: { max: 10485760 }          # 10 MB
  x:
    verified: 2026-09-04
    formats: [jpeg, png, webp]
    size_bytes: { max: 5242880 }           # 5 MB

# Normalization policy (docs/POSTABILITY.md stage 4).
normalization:
  auto_fix:   # deterministic, quality-preserving — applied silently, reported
    - remux_mp4_faststart
    - transcode_audio_aac_48k
    - transcode_h264_when_required
    - bake_rotation
    - vfr_to_cfr
    - downscale_to_target_max
    - cap_bitrate
  never_auto_fix:   # creator decides — color/content-altering
    - hdr_tonemap          # warns; creator chooses tonemap or SDR re-export
    - trim_duration        # blocker with fix_hint, never silently cut
    - crop_aspect          # blocker with fix_hint, never silently reframed
