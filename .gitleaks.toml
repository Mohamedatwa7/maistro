# Secret scan (Phase 12 CI, SECURITY.md §1). Default gitleaks rules, plus Postgres URLs that embed a password.
[extend]
useDefault = true

[[rules]]
id = "postgres-url-with-password"
description = "A Postgres connection string with an inline password"
regex = '''postgres(?:ql)?://[^:@\s/'"]+:[^@\s'"]{6,}@[^\s'"]+'''
keywords = ["postgres"]

# The one known, accepted finding (a localhost test DB URL in 5cd057a) is ignored by its exact fingerprint in
# .gitleaksignore — not by path, commit or pattern.
