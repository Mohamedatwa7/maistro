<!doctype html><html><head><title>kymah fixture</title></head><body><script>self.__next_f=self.__next_f||[];self.__next_f.push([0])</script><script>self.__next_f.push([1,"{\"stats\":{\"note\":\"fixture\"},\"trends\":[{\"id\":\"snd-7678781752288495633\",\"eng\":22,\"fit\":{\"beat\":null,\"reason\":\"Human choreography performance; no transferable device for a generated product remake.\",\"judgedAt\":\"2026-10-17T09:06:03.379Z\",\"strength\":42},\"pos\":{\"x\":44.5,\"y\":48},\"why\":\"Measured: 79 creators / 95 sampled videos, 21% posted this week, adoption accelerating.\",\"kind\":\"trend\",\"lang\":\"en\",\"name\":\"Come Back and Back dance challenge\",\"tags\":[],\"brief\":{\"onBrand\":[],\"sources\":[\"TikTok Top 50 #19\",\"95 videos sampled 2026-10-21\"],\"category\":\"dance/choreography\",\"mechanic\":\"Dancers face the camera in a single locked shot, performing a repeated choreography synced to the Jersey Club beat, with sharp arm pops, hip bounces and a reaching gesture upward on the hook; the clip loops through the routine with no cuts, often filmed in a mirror or hallway for full body visibility.\",\"microTrend\":\"Come Back and Back dance challenge\",\"adaptations\":[]},\"scope\":\"global\",\"sound\":{\"cue\":\"the 'come back and back' vocal hook where the arm pop and reach gesture lands\",\"title\":\"Wyw my sweetie #JerseyClub - Slowed\",\"author\":\"nissi & 25Hzz\",\"musicId\":\"7678781752288495633\",\"commercialUse\":{\"basis\":\"post-payload\",\"cleared\":false,\"checkedAt\":\"2026-10-20T07:16:59.862Z\"}},\"stage\":\"peaking\",\"growth\":\"+6%/day\",\"thumbs\":[{\"vid\":\"7692801000532446496\",\"role\":\"top\",\"sound\":\"Wyw my sweetie #JerseyClub - Slowed\",\"views\":\"3.6M\",\"handle\":\"@kellyisdancing\"},{\"vid\":\"7690478856108592415\",\"role\":\"earliest-observed\",\"sound\":\"Wyw my sweetie #JerseyClub - Slowed\",\"views\":\"1.5M\",\"handle\":\"@missng650\"}],\"onBrand\":false,\"tracked\":{\"runsSeen\":5,\"firstSeenAt\":\"2026-10-11T09:22:26.407Z\"},\"viewsWk\":null,\"category\":\"entertainment\",\"measured\":true,\"products\":[],\"showable\":true,\"signalStrength\":70,\"durabilityClass\":\"ongoing\"},{\"id\":\"snd-7680157780221184017\",\"eng\":21.3,\"fit\":{\"beat\":\"multi-angle selfie flip as Flip/Fold beat-drop reveal\",\"reason\":\"Beat-drop flip cue can time a Galaxy Flip fold-reveal transition.\",\"judgedAt\":\"2026-10-16T08:39:27.523Z\",\"strength\":60},\"pos\":{\"x\":47.6,\"y\":55},\"why\":\"Measured: 71 creators / 92 sampled videos, 2% posted this week.\",\"kind\":\"trend\",\"lang\":\"en\",\"name\":\"CapCut Pioneer Template (multi-angle selfie flip)\",\"tags\":[],\"brief\":{\"onBrand\":[\"Multi-location montage format rewards solo creators who can rig the shot fast in a new place every few seconds, a real logistics problem the Flip's self-standing hinge solves without extra gear\",\"Template is peaking now, participation needs to be fast and low-friction, both adaptations use features already on the device with no new app or workflow to learn\",\"The format's currency is rhythm and variety across cuts, not image quality, so the brief stays on hands-free behaviour and on-device restyling rather than any camera spec\"],\"sources\":[\"TikTok Viral 50 #6\",\"92 videos sampled 2026-10-21\"],\"category\":\"Creator Culture \\u00b7 Template Edits\",\"mechanic\":\"Creator shoots the same self in rapid-fire settings (bedroom, bathroom, car, hallway), cutting on hair flips and pose changes synced to beat drops in a reusable CapCut template, the pleasure is the rhythm of the cut and the multiplicity of the subject, not a single reveal.\",\"microTrend\":\"Multi-angle selfie flip montage\",\"adaptations\":[{\"cta\":\"Caption: 'try it hands-free and tag me' to invite duets that copy the propping, not just the pose.\",\"dos\":[\"Show the prop moment at least once so viewers register it's hands-free, not just assume a tripod\",\"Keep the cut speed identical to the original template, don't slow down to show off the phone\",\"Pick settings with a believable flat or ledge surface so the prop reads as natural, not staged\"],\"hook\":\"Same five seconds, five rooms, but your hands are empty in every single one.\",\"idea\":\"Use the half-folded Flip propped on its own hinge in every single setting (bedroom shelf, car cupholder, bathroom sink edge, locker ledge) so both hands are free for the pose and hair flip on every cut, no one holding the phone in any clip.\",\"line\":\"Foldable\",\"donts\":[\"Don't linger on the phone itself between cuts, it breaks the rhythm the template depends on\",\"Don't swap in a studio tripod shot, the whole point is no extra gear\",\"Don't over-explain the feature in text over every clip, one caption line is enough\"],\"insight\":\"The template's whole joke is 'I did this everywhere,' which means the creator is secretly solving a logistics problem (who's filming me in the car, in the bathroom, in the hallway) in every single location. A phone that free-stands removes the one friction point that stops people attempting the harder, more-locations version of the trend.\",\"product\":\"Galaxy Z Flip8\",\"soundUse\":\"Keep the trend's original beat-drop edit untouched, cut on every flip and drop exactly like the template, the hands-free framing is additive and never slows the rhythm.\",\"execution\":[\"Open on bedroom: Flip half-folded on a shelf, creator steps into frame hands-free for the first pose\",\"Hard cut on the beat to bathroom: Flip propped on the sink ledge, same flip-and-pose, zero hands on the phone\",\"Cut to car: Flip balanced in the cupholder angled up, pose happens mid-seat\",\"Cut to school hallway: Flip propped against a locker base, final flip lands on the beat drop\",\"Quick recap flash of all four propped positions in one corner collage\",\"End on the strongest pose held a beat longer than the cuts before it\"],\"samsungify\":\"A slab phone needs a hand or a tripod in every setting; the Flip stands on its own hinge anywhere flat, so the whole multi-location premise of the template gets easier to pull off solo.\",\"onScreenText\":\"4 rooms, 0 hands on my phone. \\u0664 \\u0623\\u0645\\u0627\\u0643\\u0646\\u060c \\u0648\\u0644\\u0627 \\u0645\\u0631\\u0629 \\u0645\\u0633\\u0643\\u062a \\u0627\\u0644\\u0645\\u0648\\u0628\\u0627\\u064a\\u0644\",\"featureMoment\":\"In every setting the viewer sees the phone already standing on its own, hinge bent, before the creator steps into frame, no hand ever touches it during the pose.\"},{\"cta\":\"Ask 'guess which one is the real room' in the caption to drive comment guesses.\",\"dos\":[\"Keep the reveal honest and quick, the surprise is the hook, not a deception to sustain\",\"Match the restyle intensity across all four so none looks obviously fake next to the others\",\"Use real on-device edits, not a pre-made filter pack\"],\"hook\":\"Same bedroom, four completely different vibes, same five seconds.\",\"idea\":\"Do a second pass of the same template where one setting per video is swapped on-device, bedroom wall recoloured, a poster removed, a messy desk cleaned, so each location in the montage looks intentionally different without actually changing rooms.\",\"line\":\"AI\",\"donts\":[\"Don't hide the reveal entirely, claiming four real rooms invites callouts\",\"Don't over-edit into an unrecognizable scene, the gag only works if it's clearly the same space, reimagined\",\"Don't slow the main montage down to show the editing process, keep that to the one quick flash\"],\"insight\":\"Not everyone has four distinct rooms (bedroom, bathroom, car, hallway) that look good on camera; creators with one small room want the multi-setting payoff anyway. Letting them fake the variety convincingly, in their own gallery, is a real access problem the template creates for anyone without a varied house.\",\"product\":\"Galaxy AI (Generative Edit)\",\"soundUse\":\"Same template audio, unedited; add a short sound dip only on the before/after reveal frame to flag the twist without killing the beat-drop cuts.\",\"execution\":[\"Film the full template in one room only, same pose changes and flips as always\",\"Open Generative Edit between cuts to shift wall color, lighting tone, or remove clutter for each 'setting'\",\"Stitch the four restyled takes into the same rapid-cut rhythm as the original template\",\"Flash a quick before/after of the one real room next to its four edited versions\",\"Finish on the full four-cut montage playing at full speed, indistinguishable from a multi-location shoot\"],\"samsungify\":\"The edit happens on-device in the gallery app the creator already has open, no separate app, no watermark, so the restyled cut can post the same day as the original take.\",\"onScreenText\":\"all 4 scenes, 1 actual room. \\u0627\\u0644\\u0623\\u0631\\u0628\\u0639 \\u0645\\u0634\\u0627\\u0647\\u062f \\u0628\\u063a\\u0631\\u0641\\u0629 \\u0648\\u062d\\u062f\\u0629 \\u0628\\u0633\",\"featureMoment\":\"The viewer sees a quick before/after flash: the same bedroom corner, then recoloured and restyled into four distinct looks, confirming it's one room edited, not four rooms filmed.\"}]},\"scope\":\"global\",\"sound\":{\"cue\":null,\"title\":\"Hide It\",\"author\":\"SWAE\",\"musicId\":\"7680157780221184017\",\"commercialUse\":{\"basis\":\"post-payload\",\"cleared\":false,\"checkedAt\":\"2026-10-20T07:16:59.862Z\"}},\"stage\":\"peaking\",\"growth\":\"+1%/day\",\"thumbs\":[{\"vid\":\"7689878512617950477\",\"role\":\"top\",\"sound\":\"Hide It\",\"views\":\"273K\",\"handle\":\"@wethebestgirlzz\"},{\"vid\":\"7689305653399129375\",\"role\":\"earliest-observed\",\"sound\":\"Hide It\",\"views\":\"164K\",\"handle\":\"@tjaytemplates\"}],\"onBrand\":true,\"tracked\":{\"runsSeen\":15,\"firstSeenAt\":\"2026-10-06T09:43:21.103Z\"},\"viewsWk\":null,\"category\":\"other\",\"measured\":true,\"products\":[{\"line\":\"Foldable\",\"score\":78,\"reason\":\"The half-fold FlexCam stands itself up so the multi-angle flip sequence can be staged hands-free betwe ull,\"category\":\"entertainment\",\"measured\":true,\"products\":[],\"showable\":true,\"signalStrength\":70,\"durabilityClass\":\"ongoing\"},{\"id\":\"snd-7668271352941742081\",\"eng\":7.8,\"fit\":{\"beat\":null,\"reason\":\"Human choreography performance; no transferable device or product hook to remake.\",\"judgedAt\":\"2026-09-03T08:30:12.604Z\",\"strength\":42},\"pos\":{\"x\":49.2,\"y\":37},\"why\":\"Measured: 92 creators / 106 sampled videos, 0% posted this week.\",\"kind\":\"trend\",\"lang\":\"en\",\"name\":\"Vibin dance challenge\",\"tags\":[],\"brief\":{\"onBrand\":[],\"sources\":[\"TikTok Viral 50 #19\",\"106 videos sampled 2026-10-21\"],\"category\":\"dance\",\"mechanic\":\"Creator or duo stands facing camera in a single locked shot, often in a plain or scenic backdrop, and performs a repeated arm and shoulder groove synced to the beat of Vibin, with the same bounce and hand pop moves carried through the clip.\",\"microTrend\":\"Vibin dance challenge\",\"adaptations\":[]},\"scope\":\"global\",\"sound\":{\"cue\":\"the vibin beat drop where the arm pump and shoulder bounce hits land on beat\",\"title\":\"Vibin\",\"author\":\"Wxoda\",\"musicId\":\"7668271352941742081\",\"commercialUse\":{\"basis\":\"post-payload\",\"cleared\":true,\"checkedAt\":\"2026-10-20T07:16:59.862Z\"}},\"stage\":\"peaking\",\"growth\":\"+1%/day\",\"thumbs\":[{\"vid\":\"7684779194814926111\",\"role\":\"top\",\"sound\":\"Vibin\",\"views\":\"17.0M\",\"handle\":\"@ebbyj\"},{\"vid\":\"7681723191479356685\",\"role\":\"earliest-observed\",\"sound\":\"Vibin\",\"views\":\"2.9M\",\"handle\":\"@annafrey\"}],\"onBrand\":false,\"tracked\":{\"runsSeen\":40,\"firstSeenAt\":\"2026-08-23T04:57:20.141Z\"},\"viewsWk\":null,\"category\":\"entertainment\",\"measured\":true,\"products\":[],\"showable\":true,\"signalStrength\":70,\"durabilityClass\":\"ongoing\"},{\"id\":\"snd-7585687637122631696\",\"eng\":20.7,\"fit\":{\"beat\":null,\"reason\":\"Human choreography performance; generated remake loses the trend, no transferable product device.\",\"judgedAt\":\"2026-09-26T09:43:25.123Z\",\"strength\":42},\"pos\":{\"x\":46.1,\"y\":80},\"why\":\"Measured: 74 creators / 93 sampled videos, 14% posted this week.\",\"kind\":\"trend\",\"lang\":\"en\",\"name\":\"Dip On Em dance challenge\",\"tags\":[],\"brief\":{\"onBrand\":[],\"sources\":[\"TikTok Viral 50 #3\",\"93 videos sampled 2026-10-21\"],\"category\":\"dance challenge\",\"mechanic\":\"Dancer films themselves solo or with a partner in a locked static shot, performing a repeated choreography routine synced to the DIP ON EM beat, often with a caption or on-screen label naming the moment, and the clip ends simply when the routine loop finishes without a distinct punchline cut.\",\"microTrend\":\"Dip On Em dance challenge\",\"adaptations\":[]},\"scope\":\"global\",\"sound\":{\"cue\":null,\"title\":\"DIP ON EM\",\"author\":\"SouthMemphisHypeman\",\"musicId\":\"7585687637122631696\",\"commercialUse\":{\"basis\":\"post-payload\",\"cleared\":false,\"checkedAt\":\"2026-10-20T07:16:59.862Z\"}},\"stage\":\"peaking\",\"growth\":\"+4%/day\",\"thumbs\":[{\"vid\":\"7695254388750781709\",\"role\":\"top\",\"sound\":\"DIP ON EM\",\"views\":\"2.9M\",\"handle\":\"@rahtitouillee\"},{\"vid\":\"7695812838442454285\",\"sound\":\"DIP ON EM\",\"views\":\"796K\",\"handle\":\"@xelmoe\"}],\"onBrand\":false,\"tracked\":{\"runsSeen\":19,\"firstSeenAt\":\"2026-09-26T09:02:53.000Z\"},\"viewsWk\":null,\"category\":\"entertainment\",\"measured\":true,\"products\":[],\"showable\":true,\"signalStrength\":63,\"durabilityClass\":\"ongoing\"},{\"id\":\"snd-7683619692979751687\",\"eng\":29.6,\"fit\":{\"beat\":\"brand-hop meme riff using Galaxy AI portrait edit as the punchline\",\"reason\":\"Riff wave fits Galaxy AI portrait edit as the punchline twist.\",\"judgedAt\":\"2026-10-12T10:07:03.260Z\",\"strength\":78},\"pos\":{\"x\":58.5,\"y\":42},\"why\":\"Measured: 61 creators / 92 sampled videos, 23% posted this week. Carried 2d past its last fresh sighting \\u2014 population counter +1.87%/day.\",\"kind\":\"trend\",\"lang\":\"en\",\"name\":\"Captioned Portrait Punchline Meme\",\"tags\":[],\"brief\":{\"onBrand\":[\"Format is entirely text-and-stillness driven, which rewards genuinely original source images over recycled ones, a gap Samsung's on-device creation tools can fill without breaking the deadpan\",\"Zero reliance on camera movement or specs keeps every adaptation about participation in the joke, not equipment\",\"Trend is already past peak and declining, so the brief favors fast, low-production entries over anything requiring a shoot or crew\"],\"sources\":[\"TikTok discovery radar (off-chart riser)\",\"92 videos sampled 2026-10-12\"],\"category\":\"Comedy \\u00b7 Meme Culture\",\"mechanic\":\"A single static image sits locked on screen while two or three text captions build in sequence like a dialogue or dramatic quote, landing on a punchline or wistful line. No cuts, no camera movement; the whole joke rides on the escalating text revealed over the sound.\",\"microTrend\":\"Captioned portrait punchline meme\",\"adaptations\":[{\"cta\":\"Caption asks 'send me your worst photo, I'll make it a painting' to invite submissions and remixes in comments.\",\"dos\":[\"Keep the restyle subtle enough that it still half-reads as a real old photo\",\"Pick a genuinely mundane source photo, the gap between grandeur and banality is the joke\",\"Let the static image breathe, no zoom or pan added\"],\"hook\":\"A caption reads 'found this painting of my ancestor' over what is obviously your own restyled phone photo, before the punchline reveals it's you from 2019.\",\"idea\":\"Take an old, slightly embarrassing or dramatic personal photo, use on-device Generative Edit to restyle it into a painting-like portrait, then run the format's caption escalation over the restyled still as if it were the old master painting everyone's been using.\",\"line\":\"AI\",\"donts\":[\"Never show the edit happening on screen, it breaks the deadpan\",\"Don't caption-drop the product name, the format has zero brand language in it\",\"Avoid an image so obviously AI-generated that it reads as a filter demo instead of a joke\"],\"insight\":\"The format's humor depends on the image reading as found, not made; any visible edit tool or watermark instantly kills the deadpan. A creator who can restyle their own photo invisibly gets a funnier, more personal punchline than recycling the same stock paintings everyone else uses.\",\"product\":\"Galaxy AI (Generative Edit / Photo Assist)\",\"soundUse\":\"Use the trend's own ambient or dramatic audio bed under the captions; no voiceover, let the text and the sound alone carry escalation, cut nothing.\",\"execution\":[\"Pick an awkward or overly serious personal photo sitting in the camera roll\",\"Run Generative Edit to restyle it into an oil-painting or vintage-photo look, nothing else changed\",\"Lock the restyled image on screen, full stop, no cropping or pan\",\"Caption one lands: a faux-reverent description of 'the painting'\",\"Caption two lands: a detail that undercuts it\",\"Caption three lands: the punchline revealing it's the creator, dated and ordinary\",\"Hold on the final caption for a beat before the loop restarts\"],\"samsungify\":\"Generative Edit restyles the photo entirely on-device, no watermark, no third-party app logo sitting in the corner to break the joke's deadpan format.\",\"onScreenText\":\"this portrait of my great aunt, the detail..., it's me in 2019 after one tequila\",\"featureMoment\":\"The viewer sees a convincingly old-looking portrait, then the final caption reveals the restyled photo was a selfie from a few years back, the restyle doing the work the joke needs invisibly.\"},{\"cta\":\"Ask viewers to request a sketch subject in the comments for the next one, turning the format into a recurring series.\",\"dos\":[\"Keep the sketch intentionally rough, polish undercuts the joke\",\"Match the captioning rhythm and font style the format already uses\",\"Post it as a one-off still, never a drawing timelapse\"],\"hook\":\"A rough, flat sketch sits on screen captioned like a gallery placard, before the punchline undercuts the whole premise.\",\"idea\":\"Sketch a deliberately bad or deadpan portrait of a friend, pet, or situation on the Tab, then run the same caption-escalation format over the sketch instead of a found photo or painting.\",\"line\":\"Tab\",\"donts\":[\"Don't show the stylus or the app interface, it reframes the video as a tutorial\",\"Never over-render the sketch into something that looks professionally finished\",\"Don't explain the joke in the caption text, let the escalation do it\"],\"insight\":\"The format has a growth problem precisely because the image pool is limited and recognizable; the next wave of creators in this format differentiate by supplying an original image rather than another recycled painting, and a drawing tool is the fastest way to generate one.\",\"product\":\"Galaxy Tab S11\",\"soundUse\":\"Keep the trend's ambient or dramatic music bed exactly as used elsewhere in the format; do not add narration over it.\",\"execution\":[\"Sketch something deliberately flat and amateur, a pet, a coworker, a breakup scene\",\"Export the sketch as a single static still\",\"Lock it on screen, no pan or zoom\",\"Caption one lands: an overly formal description as if describing fine art\",\"Caption two lands: a specific, petty detail\",\"Caption three lands: the punchline, often self-deprecating about the drawing quality itself\",\"Hold the final frame\"],\"samsungify\":\"The large canvas and pen make the sketch itself fast enough to produce same-day, so the format becomes original content instead of recycled stock images everyone's seen before.\",\"onScreenText\":\"self portrait, 2026, the brushwork, I cannot draw hands\",\"featureMoment\":\"The viewer watches a clearly hand-drawn, imperfect sketch get treated with mock-reverent captions, the joke's originality coming from the fact nobody has s  joke land\"],\"sources\":[\"TikTok discovery radar (off-chart riser)\",\"96 videos sampled 2026-10-08\"],\"category\":\"Comedy \\u00b7 Audio Meme\",\"mechanic\":\"Creator sets an everyday scenario in on-screen text in a single locked static shot, then the clip pays off on the sung line Thank You Baby as the punchline, synced to hands reaching for or counting money. No camera movement or cuts, the joke lands purely on the audio drop matching the caption's setup.\",\"microTrend\":\"Thank You Baby money reaction meme\",\"adaptations\":[{\"cta\":\"Caption asks 'what's your version of this' and invites duets with the same static propped setup.\",\"dos\":[\"Keep the shot dead static, any camera motion kills the deadpan\",\"Make the caption setup mundane and specific, not dramatic\",\"Let the audio drop do all the comedic work, no reaction face\"],\"hook\":\"Text on screen: 'when he finally pays you back' over a static table shot, phone just... standing there with no one touching it.\",\"idea\":\"Set the caption up as someone owing you money or handing over cash through a shared Samsung Wallet / cash-swap moment, phone propped half-folded hands-free on the table so both hands are free to count or receive the money on the beat drop.\",\"line\":\"Foldable\",\"donts\":[\"Don't show the phone being propped or adjusted on camera, it should look like it's just there\",\"Don't add zooms or cuts on the punchline, the format is one locked take\",\"Don't force a branded product in hand, the cash/money is the only prop\"],\"insight\":\"The format's whole joke depends on a locked, untouched static shot, any wobble or handheld shake breaks the deadpan setup. Creators already hunt for a free surface or stack of books to rest the phone on; a phone that stands itself up at the right angle removes that friction entirely.\",\"product\":\"Galaxy Z Flip8\",\"soundUse\":\"Hard sync: the sung line Thank You Baby must land in the exact frame the hand touches the cash, cut nothing before it, hold nothing after more than a beat.\",\"execution\":[\"Open on a static table-level shot, phone already standing on its own, nobody adjusting it\",\"Caption types on screen: the everyday setup (allowance, bet payout, friend owing lunch money)\",\"Hold the static shot for a beat, deadpan, no movement\",\"Hand enters frame holding cash or a phone with a payment confirmation\",\"Audio drops on Thank You Baby exactly as the hand reaches or starts counting\",\"Hold on the final static frame for a half-second after the punchline lands\"],\"samsungify\":\"The half-folded FlexCam stands on its own on the table at the exact eye-line height the format needs, so both hands are free for the money beat with nobody holding the phone or propping it on a cup.\",\"onScreenText\":\"when he said keep the change. \\u0644\\u0645\\u0627 \\u0642\\u0627\\u0644 \\u062e\\u0644\\u064a\\u0647 \\u0639\\u0646\\u062f\\u0643\",\"featureMoment\":\"The viewer notices the phone is upright on the table with nothing propping it and no hand touching it, the FlexCam half-fold is doing that invisibly before the punchline even starts.\"},{\"cta\":\"Ask viewers to share their 'notification that saved the day' in the comments.\",\"dos\":[\"Keep the wrist and watch face the entire frame, no extra motion\",\"Make sure the notification is a real, readable payment confirmation, not a fake graphic\",\"Time the light-up precisely, timing is the whole joke\"],\"hook\":\"Text: 'when the refund hits before you even asked' over a static shot of a wrist resting on a table.\",\"idea\":\"Caption sets up a scenario where a Samsung Wallet tap-to-pay or a watch notification is the thing that pays off, wrist raises into frame right as the sung line drops, confirming the payment buzz landed.\",\"line\":\"Watch\",\"donts\":[\"Don't narrate or caption what the notification says, let it stay visual\",\"Don't add a reaction shot of a face, breaks the static rule\",\"Don't turn it into a product demo of watch features beyond the one
